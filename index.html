<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Планировщик задач</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      window.__showBootError = function (message) {
        var root = document.getElementById("root");
        if (!root) return;

        root.innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f8fafc;color:#0f172a;font-family:Inter,system-ui,sans-serif;">' +
          '<div style="max-width:560px;border:1px solid #fecaca;background:#fff;border-radius:20px;padding:24px 28px;box-shadow:0 20px 40px rgba(15,23,42,0.08);">' +
          '<div style="font-size:20px;font-weight:700;margin-bottom:8px;">Приложение не смогло запуститься</div>' +
          '<div style="font-size:14px;line-height:1.5;color:#475569;">' +
          String(message || "Неизвестная ошибка") +
          "</div>" +
          "</div>" +
          "</div>";
      };

      window.addEventListener("error", function (event) {
        window.__showBootError(
          event && event.error && event.error.message
            ? event.error.message
            : event && event.message
              ? event.message
              : "Ошибка загрузки приложения",
        );
      });

      window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason;
        window.__showBootError(
          reason && reason.message ? reason.message : String(reason || "Unhandled promise rejection"),
        );
      });
    </script>
    <script type="module" crossorigin src="/task-planner/assets/index-BioV9n0R.js"></script>
    <link rel="stylesheet" crossorigin href="/task-planner/assets/index-BFNQY9_J.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
