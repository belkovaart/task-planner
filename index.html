<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440" />
<title>Планировщик задач</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ===== DESIGN TOKENS ===== */
  :root {
    /* Surfaces — cool, calm neutrals */
    --bg: #f6f8fb;
    --panel: #ffffff;
    --panel-2: #fbfcfe;

    /* Ink */
    --ink: #0f172a;
    --ink-2: #334155;
    --ink-3: #64748b;
    --ink-4: #94a3b8;
    --ink-5: #cbd5e1;

    /* Lines — subtle */
    --line: #eef1f6;
    --line-2: #e2e8f0;
    --line-3: #cbd5e1;

    /* Weekend — very subtle */
    --weekend: #f1f4f8;

    /* Semantic role colors */
    --selection: #2563eb;
    --selection-bg: #eff4ff;
    --selection-bg-2: #dbe7ff;

    --today: #2563eb;

    --progress: #8fd84f;
    --progress-bg: #e8fbd4;
    --progress-border: #adfa86;
    --progress-ink: #3d6b15;

    --done: #059669;
    --done-bg: #e4f5ee;
    --done-border: #9cd8bd;
    --done-ink: #0a5b3e;

    --planned: #64748b;
    --planned-bg: #eef1f6;
    --planned-border: #d7dce6;

    --paused: #94a3b8;
    --paused-bg: #f1f4f8;

    --conflict: #e11d48;
    --conflict-bg: #fff0f3;
    --conflict-border: #fecdd3;

    --p-high: #e11d48;
    --p-med:  #8fd84f;
    --p-low:  #94a3b8;

    --radius: 6px;
    --row-h: 36px;

    --shadow-pop: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.08);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11", "ss01";
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  input:focus, select:focus, textarea:focus, button:focus { outline: none; }

  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d7dce6; border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #a8b1c4; }

  /* ===== APP LAYOUT ===== */
  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: 44px 1fr;
    height: 100vh;
    min-height: 700px;
  }

  /* ===== TOP BAR ===== */
  header.topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 13px; letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 16px; height: 16px; border-radius: 3px;
    background: var(--ink);
    position: relative;
  }
  .brand-mark::after {
    content: ''; position: absolute; left: 3px; top: 4px;
    width: 7px; height: 2px; background: var(--panel);
    box-shadow: 0 3.5px 0 var(--panel), 0 -3.5px 0 var(--panel);
  }
  .brand .sep { color: var(--ink-4); font-weight: 400; margin: 0 2px; }
  .brand .sub { color: var(--ink-3); font-weight: 400; font-size: 12px; }

  .topbar-metrics {
    display: flex; align-items: center; gap: 2px;
    font-size: 11.5px; color: var(--ink-3);
  }
  .metric {
    padding: 4px 10px;
    display: inline-flex; align-items: baseline; gap: 5px;
  }
  .metric + .metric { border-left: 1px solid var(--line); }
  .metric .v { color: var(--ink); font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .metric.warn .v { color: var(--conflict); }

  .topbar-right { display: flex; align-items: center; gap: 6px; }

  .ghost-btn {
    width: 26px; height: 26px;
    border: none; background: transparent;
    border-radius: 5px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-3);
  }
  .ghost-btn:hover { background: var(--line); color: var(--ink); }

  /* ===== LEFT: FORM ===== */
  aside.form-pane {
    border-right: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .pane-header {
    padding: 14px 18px 8px;
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
  }
  .pane-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .pane-sub { font-size: 11px; color: var(--ink-4); }

  .form {
    padding: 12px 18px 20px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .form-mode {
    padding: 8px 10px;
    border-radius: var(--radius);
    font-size: 11.5px;
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg);
    color: var(--ink-2);
  }
  .form-mode.editing {
    background: var(--selection-bg);
    color: var(--selection);
  }
  .form-mode .label { font-weight: 500; }
  .form-mode .task-id { font-size: 11px; opacity: 0.7; }

  .field-group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field-group > label {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.01em;
    line-height: 1.3;
    display: flex;
    align-items: baseline;
    gap: 5px;
  }
  .field-group .hint {
    font-size: 10.5px; color: var(--ink-4); font-weight: 400;
  }
  .field-help {
    font-size: 10.5px; color: var(--ink-4);
    line-height: 1.35;
    margin-top: 2px;
  }
  .field-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    align-items: end;
  }

  .input, .select {
    padding: 7px 9px;
    border: 1px solid var(--line-2);
    border-radius: 5px;
    background: var(--panel);
    font-size: 13px;
    color: var(--ink);
    width: 100%;
    height: 32px;
    transition: border-color .12s, box-shadow .12s, background .12s;
  }
  .input::placeholder { color: var(--ink-4); }
  .input:hover, .select:hover { border-color: var(--line-3); }
  .input:focus, .select:focus {
    border-color: var(--selection);
    box-shadow: 0 0 0 3px var(--selection-bg);
  }
  .input.error, .select.error {
    border-color: var(--conflict);
    background: var(--conflict-bg);
  }
  .input.readonly {
    background: var(--bg);
    color: var(--ink-3);
    cursor: default;
  }
  .select {
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%2364748b' stroke-width='1.3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 28px;
  }
  .error-msg {
    font-size: 11px;
    color: var(--conflict);
    display: flex; align-items: center; gap: 5px;
    margin-top: 2px;
  }
  .error-msg::before {
    content: '!'; width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--conflict); color: white;
    font-size: 9px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  /* Chips */
  .chips {
    display: flex; flex-wrap: wrap; gap: 5px;
  }
  .chip {
    padding: 5px 9px 5px 8px;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    background: var(--panel);
    font-size: 11.5px;
    color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 5px;
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .chip:hover { background: var(--bg); border-color: var(--line-3); }
  .chip .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--chip-dot, var(--ink-4));
    flex-shrink: 0;
  }
  .chip.active {
    background: var(--chip-active-bg, var(--selection-bg));
    border-color: var(--chip-active-border, var(--selection));
    color: var(--chip-active-ink, var(--selection));
  }
  .chip.active .dot { box-shadow: 0 0 0 1.5px var(--panel); }

  /* Action buttons */
  .actions {
    display: flex; flex-direction: column; gap: 6px;
    padding-top: 4px;
  }
  .btn {
    padding: 8px 12px;
    border: 1px solid var(--line-2);
    border-radius: 5px;
    background: var(--panel);
    color: var(--ink-2);
    font-weight: 500;
    font-size: 12.5px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .12s, border-color .12s, color .12s;
    height: 34px;
  }
  .btn:hover { background: var(--bg); color: var(--ink); border-color: var(--line-3); }
  .btn-primary {
    background: var(--selection);
    color: white;
    border-color: var(--selection);
  }
  .btn-primary:hover { background: #1d4ed8; color: white; border-color: #1d4ed8; }
  .btn-danger {
    color: var(--conflict);
    border-color: var(--conflict-border);
  }
  .btn-danger:hover { background: var(--conflict-bg); color: var(--conflict); border-color: #fca5b4; }
  .btn-ghost { border-color: transparent; color: var(--ink-3); }
  .btn-ghost:hover { background: var(--bg); color: var(--ink-2); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  /* ===== MAIN AREA ===== */
  main.main-pane {
    display: grid;
    grid-template-rows: 1fr 280px;
    overflow: hidden;
    min-width: 0;
  }

  /* ===== TIMELINE ===== */
  .timeline-wrap {
    display: flex; flex-direction: column;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    min-height: 0;
    overflow: hidden;
  }
  .timeline-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px;
    gap: 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .tl-title-group { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
  .tl-range {
    font-size: 13.5px; font-weight: 600; color: var(--ink);
  }
  .tl-today-inline {
    font-size: 11.5px; color: var(--ink-3);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .tl-today-inline::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--today);
  }
  .tl-controls { display: flex; gap: 4px; align-items: center; }

  .zoom-group {
    display: inline-flex; background: var(--bg);
    border: 1px solid var(--line-2);
    border-radius: 5px; overflow: hidden;
    padding: 2px;
    gap: 1px;
  }
  .zoom-group button {
    padding: 0 10px; height: 24px;
    background: transparent; border: none;
    font-size: 11.5px; color: var(--ink-3);
    border-radius: 3px;
  }
  .zoom-group button:hover { color: var(--ink); }
  .zoom-group button.active {
    background: var(--panel); color: var(--ink);
    box-shadow: 0 1px 2px rgba(15,23,42,0.06);
  }

  .today-btn {
    padding: 0 10px; height: 28px;
    font-size: 12px;
    border: 1px solid var(--line-2);
    background: var(--panel);
    border-radius: 5px;
    color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .today-btn:hover { background: var(--bg); color: var(--ink); }

  .tl-scroll {
    flex: 1; min-height: 0;
    overflow-x: auto; overflow-y: auto;
    position: relative;
    background: var(--panel);
  }
  .tl-grid {
    position: relative;
    min-width: 100%;
  }

  /* Header */
  .tl-header {
    position: sticky; top: 0; z-index: 5;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .tl-months {
    display: flex;
    border-bottom: 1px solid var(--line);
    height: 22px;
  }
  .tl-month {
    padding: 4px 10px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
    display: flex; align-items: center;
    border-right: 1px solid var(--line);
  }
  .tl-days {
    display: flex;
    height: 32px;
    background: var(--panel);
  }
  .tl-day {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 10px;
    color: var(--ink-3);
    flex-shrink: 0;
    position: relative;
    gap: 1px;
  }
  .tl-day + .tl-day { border-left: 1px solid var(--line); }
  .tl-day .dow {
    font-size: 9px; color: var(--ink-4);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .tl-day .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--ink-2); font-weight: 500;
  }
  .tl-day.weekend { background: var(--weekend); }
  .tl-day.weekend .num, .tl-day.weekend .dow { color: var(--ink-4); }
  .tl-day.today .num { color: var(--today); font-weight: 700; }
  .tl-day.today .dow { color: var(--today); }

  /* Workload strip */
  .tl-workload-wrap {
    position: sticky; top: 55px; z-index: 4;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
    padding: 4px 0;
  }
  .tl-workload-label {
    position: absolute;
    left: 6px; top: 50%;
    transform: translateY(-50%);
    font-size: 9px;
    font-weight: 600;
    color: var(--ink-4);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    z-index: 1;
    pointer-events: none;
  }
  .tl-workload {
    display: flex;
    height: 26px;
  }
  .tl-wl-cell {
    flex-shrink: 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 2px 3px;
    position: relative;
  }
  .tl-wl-cell + .tl-wl-cell { border-left: 1px solid var(--line); }
  .tl-wl-cell.weekend { background: var(--weekend); }
  .tl-wl-bar {
    width: 60%;
    background: var(--ink-5);
    border-radius: 1.5px;
    min-height: 2px;
    max-height: 22px;
  }
  .tl-wl-cell[data-load="1"] .tl-wl-bar { background: var(--planned); }
  .tl-wl-cell[data-load="2"] .tl-wl-bar { background: var(--progress); }
  .tl-wl-cell[data-load="3"] .tl-wl-bar { background: var(--conflict); }
  .tl-wl-cell[data-load="4"] .tl-wl-bar,
  .tl-wl-cell[data-load="5"] .tl-wl-bar { background: var(--conflict); }

  /* Body grid */
  .tl-body {
    position: relative;
    background: var(--panel);
  }
  .tl-row {
    position: relative;
    height: var(--row-h);
    display: flex;
  }
  .tl-row + .tl-row { border-top: 1px dashed var(--line); }
  .tl-row-cell {
    flex-shrink: 0;
    height: 100%;
  }
  .tl-row-cell + .tl-row-cell { border-left: 1px solid var(--line); }
  .tl-row-cell.weekend { background: var(--weekend); }

  /* Today line */
  .tl-today-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 0;
    border-left: 1.5px solid var(--today);
    pointer-events: none;
    z-index: 3;
    opacity: 0.7;
  }
  .tl-today-line::before {
    content: '';
    position: absolute;
    top: -4px; left: -3.5px;
    width: 7px; height: 7px;
    background: var(--today);
    border-radius: 50%;
  }

  /* Overlap band */
  .tl-overlap-band {
    position: absolute;
    top: 0; bottom: 0;
    background: repeating-linear-gradient(
      135deg,
      rgba(225,29,72,0.05) 0 6px,
      rgba(225,29,72,0.10) 6px 12px
    );
    pointer-events: none;
    z-index: 1;
  }
  .tl-overlap-band::before {
    content: '';
    position: absolute; inset: 0;
    border-left: 1.5px dashed rgba(225,29,72,0.4);
    border-right: 1.5px dashed rgba(225,29,72,0.4);
  }

  /* Task bars */
  .tl-bar {
    position: absolute;
    height: 26px;
    top: 5px;
    border-radius: 5px;
    display: flex; align-items: center;
    padding: 0 9px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    overflow: hidden;
    white-space: nowrap;
    border: 1px solid transparent;
    transition: transform .1s, box-shadow .12s, opacity .12s;
    z-index: 2;
  }
  .tl-bar .bar-title {
    overflow: hidden; text-overflow: ellipsis;
    flex: 1; min-width: 0;
  }
  .tl-bar .bar-meta {
    font-size: 10px;
    color: currentColor; opacity: 0.7;
    margin-left: 8px;
    font-family: 'JetBrains Mono', monospace;
    flex-shrink: 0;
  }
  .tl-bar .bar-prio {
    width: 3px;
    align-self: stretch;
    margin: 4px 7px 4px -4px;
    border-radius: 2px;
    background: var(--bar-prio, transparent);
    flex-shrink: 0;
  }

  .tl-bar[data-status="planned"]   { background: var(--planned-bg);  border-color: var(--planned-border); color: var(--ink-2); }
  .tl-bar[data-status="progress"]  { background: var(--progress-bg); border-color: var(--progress-border); color: var(--progress-ink); }
  .tl-bar[data-status="done"]      { background: var(--done-bg);     border-color: var(--done-border);     color: var(--done-ink); }
  .tl-bar[data-status="paused"]    { background: var(--paused-bg);   border-color: var(--planned-border); color: var(--ink-3); }

  .tl-bar[data-status="done"] .bar-title { text-decoration: line-through; text-decoration-color: rgba(10,91,62,0.4); text-decoration-thickness: 1px; }
  .tl-bar[data-status="paused"] .bar-title { opacity: 0.75; }

  .tl-bar:hover {
    transform: translateY(-1px);
    box-shadow: 0 1px 3px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.08);
    z-index: 4;
  }
  .tl-bar.selected {
    border-color: var(--selection) !important;
    box-shadow: 0 0 0 1.5px var(--panel), 0 0 0 3px var(--selection);
    z-index: 6;
  }
  .tl-bar.dim { opacity: 0.32; }
  .tl-bar.conflict { box-shadow: inset 0 0 0 1px var(--conflict-border); }

  .tl-bar .bar-delete {
    display: none;
    align-items: center; justify-content: center;
    width: 18px; height: 18px;
    margin-left: 4px; margin-right: -3px;
    border-radius: 3px;
    color: currentColor; opacity: 0.55;
    background: transparent; border: none;
    padding: 0; flex-shrink: 0; cursor: pointer;
    transition: background .1s, opacity .1s, color .1s;
  }
  .tl-bar:hover .bar-delete,
  .tl-bar.selected .bar-delete { display: inline-flex; }
  .tl-bar .bar-delete:hover {
    background: rgba(225,29,72,0.12);
    color: var(--conflict); opacity: 1;
  }
  .tl-bar.tight .bar-meta { display: none; }
  .tl-bar.very-tight .bar-title { display: none; }

  /* ===== BOTTOM LIST ===== */
  .list-wrap {
    background: var(--panel);
    display: flex; flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .list-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    gap: 16px;
  }
  .list-toolbar-left {
    display: flex; align-items: center; gap: 10px;
    min-width: 0;
  }
  .list-label {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .list-filters { display: flex; gap: 2px; padding-left: 6px; border-left: 1px solid var(--line); margin-left: 2px; }
  .list-filters button {
    padding: 4px 9px;
    font-size: 11.5px;
    border: none;
    background: transparent;
    border-radius: 4px;
    color: var(--ink-3);
    transition: background .12s, color .12s;
  }
  .list-filters button:hover { background: var(--bg); color: var(--ink); }
  .list-filters button.active {
    background: var(--selection-bg);
    color: var(--selection);
  }
  .list-filters .count {
    opacity: 0.7; margin-left: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
  }
  .list-hint {
    font-size: 11px; color: var(--ink-4);
  }

  .list-scroll {
    flex: 1; min-height: 0;

  /* Status badge */

  .badge.status-paused .dot   { background: var(--paused); }

  /* Priority visual */
  .prio {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; color: var(--ink-2);

  .prio .bars { display: inline-flex; gap: 1.5px; align-items: flex-end; }
  .prio .bars span { display: block; width: 3px; background: var(--ink-5); border-radius: 1px; }
  .prio .bars span:nth-child(1) { height: 5px; }

  .prio.med .bars span:nth-child(2) { background: var(--p-med); }

  /* Conflict pill */

  .empty-icon {

  .empty-title { font-weight: 600; color: var(--ink-2); font-size: 13.5px; }
  .empty-sub { font-size: 12px; text-align: center; max-width: 340px; }

  /* ===== TWEAKS ===== */
  .tweaks-panel {
    position: fixed;

  .tweak-seg {

</style>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// ========== SUPABASE ==========
// Supabase — это Postgres-база в облаке. createClient создаёт соединение:
// URL говорит куда подключаться, ключ — что мы авторизованы на чтение/запись.
const { createClient } = supabase;
const db = createClient(
  'https://zwmrcczyungyxmtinsgx.supabase.co',
  'sb_publishable_9Kxs15P0YBluC-mAG90bLw_0nyZpxol'
);

// В базе колонки называются start_date/end_date (date — зарезервированное слово в SQL).
// Эти две функции переводят туда и обратно между форматом приложения и форматом БД.
const fromDB = (row) => ({
  id: row.id, title: row.title, url: row.url || '',
  effort: row.effort, start: row.start_date, end: row.end_date,
  status: row.status, priority: row.priority,
});
const toDB = (t) => ({
  id: t.id, title: t.title, url: t.url || '',
  effort: Number(t.effort), start_date: t.start, end_date: t.end,
  status: t.status, priority: t.priority,
});

// ========== DATE / CONSTANTS ==========
const TODAY = new Date(2026, 3, 19); // 19 April 2026

const STATUS = {
  planned:  { key: 'planned',  label: 'Запланировано', short: 'Запланировано' },
  progress: { key: 'progress', label: 'В работе',       short: 'В работе' },
  done:     { key: 'done',     label: 'Готово',         short: 'Готово' },
  paused:   { key: 'paused',   label: 'На паузе',       short: 'На паузе' },
};
const STATUS_ORDER = ['planned', 'progress', 'done', 'paused'];
const PRIORITY = {
  low:  { key: 'low',  label: 'Низкий' },
  med:  { key: 'med',  label: 'Средний' },
  high: { key: 'high', label: 'Высокий' },
};
const PRIORITY_ORDER = ['low', 'med', 'high'];

const MONTHS_RU  = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const MONTHS_FULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DOW_RU = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

const fmtISO = (dt) => {
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
};
const parseISO = (s) => {
  const [y, m, dd] = s.split('-').map(Number);
  return new Date(y, m - 1, dd);
};
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const addDays = (dt, n) => { const r = new Date(dt); r.setDate(r.getDate() + n); return r; };
const startOfDay = (dt) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
const isWeekend = (dt) => { const w = dt.getDay(); return w === 0 || w === 6; };
const fmtDateShort = (dt) => `${String(dt.getDate()).padStart(2,'0')}.${String(dt.getMonth()+1).padStart(2,'0')}`;
const pluralRu = (n, forms) => {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return forms[0];
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return forms[1];
  return forms[2];
};

// ========== SEED DATA ==========
const SEED = [
  { id: 't1', title: 'Редизайн главной страницы сайта', url: 'https://figma.com/file/redesign-home', effort: 7, start: '2026-04-06', end: '2026-04-17', status: 'done',    priority: 'high' },
  { id: 't2', title: 'Подготовка презентации для клиента', url: 'https://notion.so/client-deck', effort: 3, start: '2026-04-14', end: '2026-04-21', status: 'progress', priority: 'high' },
  { id: 't3', title: 'Интервью с пользователями (5 чел.)', url: '', effort: 4, start: '2026-04-16', end: '2026-04-22', status: 'progress', priority: 'med' },
  { id: 't4', title: 'Квартальный отчёт Q1', url: 'https://docs.google.com/q1-report', effort: 2, start: '2026-04-18', end: '2026-04-24', status: 'planned',  priority: 'high' },
  { id: 't5', title: 'Обновить документацию API', url: '', effort: 3, start: '2026-04-20', end: '2026-04-27', status: 'planned',  priority: 'low'  },
  { id: 't6', title: 'Правки по аудиту доступности', url: '', effort: 5, start: '2026-04-23', end: '2026-05-01', status: 'planned',  priority: 'med' },
  { id: 't7', title: 'Встреча с подрядчиком по аналитике', url: '', effort: 1, start: '2026-04-28', end: '2026-04-28', status: 'planned',  priority: 'low' },
  { id: 't8', title: 'Планирование спринта на май', url: '', effort: 1, start: '2026-05-04', end: '2026-05-05', status: 'paused',   priority: 'med' },
];

// ========== WORKLOAD / OVERLAPS ==========
function computeWorkload(tasks, range) {
  return range.map(day => tasks.filter(t => {
    const s = parseISO(t.start), e = parseISO(t.end);
    return day >= s && day <= e && t.status !== 'done';
  }).length);
}
function computeOverlapBands(tasks, rangeStart, rangeEnd) {
  const bands = [];
  let cur = null;
  const total = daysBetween(rangeStart, rangeEnd) + 1;
  const active = tasks.filter(t => t.status !== 'done');
  for (let i = 0; i < total; i++) {
    const day = addDays(rangeStart, i);
    const load = active.filter(t => day >= parseISO(t.start) && day <= parseISO(t.end)).length;
    if (load >= 2) {
      if (!cur) cur = { start: i, end: i };
      else cur.end = i;
    } else if (cur) {
      bands.push(cur); cur = null;
    }
  }
  if (cur) bands.push(cur);
  return bands;
}

// ========== ICONS ==========
const Icon = {
  link: () => <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M5 3H3.5A1.5 1.5 0 002 4.5v4A1.5 1.5 0 003.5 10h4A1.5 1.5 0 009 8.5V7M7 2h3v3M10 2L5.5 6.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  plus: () => <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 2v8M2 6h8" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>,
  trash: () => <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 3.5h7M4.5 3.5V2.5h3v1M3.5 3.5l.5 6h4l.5-6M5 5.5v3M7 5.5v3" stroke="currentColor" strokeWidth="1.1" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  check: () => <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.5L5 9l4.5-5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  x: () => <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
  cal: () => <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="3" y="5" width="14" height="12" rx="1.5" stroke="currentColor" strokeWidth="1.2"/><path d="M3 8h14M7 3v4M13 3v4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>,
  gear: () => <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2" stroke="currentColor" strokeWidth="1.3"/><path d="M8 1.5v2M8 12.5v2M14.5 8h-2M3.5 8h-2M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4M12.6 12.6l-1.4-1.4M4.8 4.8L3.4 3.4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>,
  target: () => <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" strokeWidth="1.2"/><circle cx="6" cy="6" r="1.3" fill="currentColor"/></svg>,
  chevR: () => <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M5 3l3 3-3 3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>,
};

// ========== CHIPS ==========
function Chips({ value, options, onChange, scheme }) {
  const schemeFor = (key) => {
    if (scheme === 'status') {
      const m = {
        planned:  { bg: 'var(--planned-bg)',  border: 'var(--planned-border)', ink: 'var(--ink-2)',       dot: 'var(--planned)' },
        progress: { bg: 'var(--progress-bg)', border: 'var(--progress-border)', ink: 'var(--progress-ink)', dot: 'var(--progress)' },
        done:     { bg: 'var(--done-bg)',     border: 'var(--done-border)',     ink: 'var(--done-ink)',    dot: 'var(--done)' },
        paused:   { bg: 'var(--paused-bg)',   border: 'var(--line-3)',          ink: 'var(--ink-3)',       dot: 'var(--paused)' },
      }[key];
      return m;
    }
    if (scheme === 'priority') {
      const m = {
        low:  { bg: 'var(--bg)',          border: 'var(--line-3)', ink: 'var(--ink-2)', dot: 'var(--p-low)' },
        med:  { bg: 'var(--progress-bg)', border: 'var(--progress-border)', ink: 'var(--progress-ink)', dot: 'var(--p-med)' },
        high: { bg: 'var(--conflict-bg)', border: 'var(--conflict-border)', ink: 'var(--conflict)', dot: 'var(--p-high)' },
      }[key];
      return m;
    }
    return { bg: 'var(--selection-bg)', border: 'var(--selection)', ink: 'var(--selection)', dot: 'var(--selection)' };
  };
  return (
    <div className="chips">
      {options.map(o => {
        const active = value === o.key;
        const s = schemeFor(o.key);
        return (
          <button
            key={o.key}
            type="button"
            className={`chip ${active ? 'active' : ''}`}
            style={{
              '--chip-dot': s.dot,
              '--chip-active-bg': s.bg,
              '--chip-active-border': s.border,
              '--chip-active-ink': s.ink,
            }}
            onClick={() => onChange(o.key)}
          >
            <span className="dot" />{o.label}
          </button>
        );
      })}
    </div>
  );
}

// ========== FORM ==========
function TaskForm({ editingTask, onAdd, onSave, onDelete, onClear }) {
  const isEdit = !!editingTask;
  const blank = {
    title: '', url: '', effort: 1,
    start: fmtISO(TODAY), end: fmtISO(addDays(TODAY, 2)),
    status: 'planned', priority: 'med',
  };
  const [f, setF] = useState(blank);
  const [touched, setTouched] = useState(false);
  const [savedFlash, setSavedFlash] = useState(false);

  useEffect(() => {
    if (editingTask) { setF({ ...editingTask }); setTouched(false); }
    else { setF(blank); setTouched(false); }
  }, [editingTask?.id]);

  const errors = {};
  if (!f.title.trim()) errors.title = 'Введите название задачи';
  if (parseISO(f.end) < parseISO(f.start)) errors.end = 'Окончание раньше начала';
  if (f.effort < 0 || !Number.isFinite(+f.effort)) errors.effort = 'Неверная оценка';
  if (f.url && !/^(https?:\/\/|mailto:|\/)/i.test(f.url.trim())) errors.url = 'Ссылка должна начинаться с http(s)://';
  const hasErrors = Object.keys(errors).length > 0;
  const duration = Math.max(1, daysBetween(parseISO(f.start), parseISO(f.end)) + 1);

  const submit = () => {
    setTouched(true);
    if (hasErrors) return;
    if (isEdit) {
      onSave(f);
      setSavedFlash(true);
      setTimeout(() => setSavedFlash(false), 1200);
    } else {
      onAdd({ ...f, id: 't' + Math.random().toString(36).slice(2, 8) });
      setF(blank); setTouched(false);
    }
  };
  const showErr = (k) => touched && errors[k];

  return (
    <div className="form">
      <div className={`form-mode ${isEdit ? 'editing' : ''}`}>
        <span className="label">{isEdit ? 'Редактирование' : 'Новая задача'}</span>
        <span className="task-id mono">{isEdit ? `#${editingTask.id}` : 'создание'}</span>
      </div>

      <div className="field-group">
        <label>Название</label>
        <input
          className={`input ${showErr('title') ? 'error' : ''}`}
          placeholder="Что нужно сделать"
          value={f.title}
          onChange={e => setF({...f, title: e.target.value})}
        />
        {showErr('title') && <div className="error-msg">{errors.title}</div>}
      </div>

      <div className="field-group">
        <label>Ссылка <span className="hint">необязательно</span></label>
        <input
          className={`input ${showErr('url') ? 'error' : ''}`}
          placeholder="https://"
          value={f.url}
          onChange={e => setF({...f, url: e.target.value})}
        />
        {showErr('url') && <div className="error-msg">{errors.url}</div>}
      </div>

      <div className="field-row">
        <div className="field-group">
          <label>Начало</label>
          <input
            type="date"
            className="input"
            value={f.start}
            onChange={e => {
              const ns = e.target.value;
              const ne = parseISO(f.end) < parseISO(ns) ? ns : f.end;
              setF({...f, start: ns, end: ne});
            }}
          />
        </div>
        <div className="field-group">
          <label>Окончание</label>
          <input
            type="date"
            className={`input ${showErr('end') ? 'error' : ''}`}
            value={f.end}
            min={f.start}
            onChange={e => setF({...f, end: e.target.value})}
          />
        </div>
      </div>
      {showErr('end') && <div className="error-msg">{errors.end}</div>}

      <div className="field-row">
        <div className="field-group">
          <label>Оценка усилий <span className="hint">раб. дни</span></label>
          <input
            type="number"
            min="0" step="0.5"
            className={`input ${showErr('effort') ? 'error' : ''}`}
            value={f.effort}
            onChange={e => setF({...f, effort: e.target.value})}
          />
        </div>
        <div className="field-group">
          <label>Календарная длительность</label>
          <input
            className="input readonly mono"
            value={`${duration} ${pluralRu(duration, ['день','дня','дней'])}`}
            readOnly
          />
        </div>
      </div>
      <div className="field-help">
        Оценка — сколько рабочих дней уйдёт на задачу. Длительность — сколько календарных дней она занимает.
      </div>

      <div className="field-group">
        <label>Статус</label>
        <Chips
          scheme="status"
          value={f.status}
          options={STATUS_ORDER.map(k => ({ key: k, label: STATUS[k].label }))}
          onChange={v => setF({...f, status: v})}
        />
      </div>

      <div className="field-group">
        <label>Приоритет</label>
        <Chips
          scheme="priority"
          value={f.priority}
          options={PRIORITY_ORDER.map(k => ({ key: k, label: PRIORITY[k].label }))}
          onChange={v => setF({...f, priority: v})}
        />
      </div>

      <div className="actions">
        {isEdit ? (
          <>
            <button className="btn btn-primary" onClick={submit}>
              {savedFlash ? <><Icon.check/> Сохранено</> : <>Сохранить изменения</>}
            </button>
            <div className="btn-row">
              <button className="btn" onClick={onClear}>Отменить</button>
              <button className="btn btn-danger" onClick={() => onDelete(editingTask.id)}>
                <Icon.trash/> Удалить
              </button>
            </div>
          </>
        ) : (
          <>
            <button className="btn btn-primary" onClick={submit}>
              <Icon.plus/> Добавить задачу
            </button>
            <button className="btn btn-ghost" onClick={() => { setF(blank); setTouched(false); }}>
              Очистить форму
            </button>
          </>
        )}
      </div>
    </div>
  );
}

// ========== TIMELINE ==========
function Timeline({ tasks, selectedId, onSelect, onDelete, dayWidth, rangeStart, rangeEnd, scrollSignal }) {
  const scrollRef = useRef(null);

  const days = useMemo(() => {
    const total = daysBetween(rangeStart, rangeEnd) + 1;
    return Array.from({ length: total }, (_, i) => addDays(rangeStart, i));
  }, [rangeStart.getTime(), rangeEnd.getTime()]);

  const months = useMemo(() => {
    const out = [];
    let cur = null;
    days.forEach((dt, i) => {
      const key = dt.getFullYear() * 12 + dt.getMonth();
      if (!cur || cur.key !== key) {
        cur = { key, label: `${MONTHS_FULL[dt.getMonth()]} ${dt.getFullYear()}`, count: 1, start: i };
        out.push(cur);
      } else cur.count++;
    });
    return out;
  }, [days]);

  const totalWidth = days.length * dayWidth;
  const workload = useMemo(() => computeWorkload(tasks, days), [tasks, days]);
  const overlapBands = useMemo(() => computeOverlapBands(tasks, rangeStart, rangeEnd), [tasks, rangeStart.getTime(), rangeEnd.getTime()]);

  const laid = useMemo(() => {
    const sorted = [...tasks].sort((a,b) => parseISO(a.start) - parseISO(b.start));
    const tracks = [];
    const result = [];
    sorted.forEach(t => {
      const s = parseISO(t.start), e = parseISO(t.end);
      let lane = -1;
      for (let i = 0; i < tracks.length; i++) {
        if (tracks[i].every(r => e < r.s || s > r.e)) { lane = i; break; }
      }
      if (lane === -1) { lane = tracks.length; tracks.push([]); }
      tracks[lane].push({ s, e });
      result.push({ ...t, lane });
    });
    return { tasks: result, lanes: Math.max(3, tracks.length) };
  }, [tasks]);

  useEffect(() => {
    if (!scrollRef.current) return;
    const todayOffset = daysBetween(rangeStart, TODAY) * dayWidth;
    scrollRef.current.scrollLeft = Math.max(0, todayOffset - 180);
  }, [dayWidth, rangeStart.getTime(), scrollSignal]);

  const todayLeft = daysBetween(rangeStart, TODAY) * dayWidth + dayWidth / 2;
  const rowHeight = 36;

  return (
    <div className="tl-scroll" ref={scrollRef}>
      <div className="tl-grid" style={{ width: totalWidth }}>
        <div className="tl-header">
          <div className="tl-months">
            {months.map(m => (
              <div key={m.key} className="tl-month" style={{ width: m.count * dayWidth }}>
                {m.label}
              </div>
            ))}
          </div>
          <div className="tl-days">
            {days.map((dt, i) => {
              const today = dt.getTime() === TODAY.getTime();
              return (
                <div
                  key={i}
                  className={`tl-day ${isWeekend(dt) ? 'weekend' : ''} ${today ? 'today' : ''}`}
                  style={{ width: dayWidth }}
                >
                  <span className="dow">{DOW_RU[dt.getDay()]}</span>
                  <span className="num">{dt.getDate()}</span>
                </div>
              );
            })}
          </div>
        </div>

        <div className="tl-workload-wrap">
          <span className="tl-workload-label">Загрузка</span>
          <div className="tl-workload">
            {days.map((dt, i) => {
              const load = workload[i];
              const we = isWeekend(dt);
              const capped = Math.min(5, load);
              const h = load === 0 ? 0 : 3 + capped * 4;
              return (
                <div
                  key={i}
                  className={`tl-wl-cell ${we ? 'weekend' : ''}`}
                  data-load={capped}
                  style={{ width: dayWidth }}
                  title={`${fmtDateShort(dt)} · ${load} ${pluralRu(load, ['задача','задачи','задач'])}`}
                >
                  {load > 0 && <div className="tl-wl-bar" style={{ height: h }}/>}
                </div>
              );
            })}
          </div>
        </div>

        <div className="tl-body" style={{ height: laid.lanes * rowHeight + 8 }}>
          {Array.from({ length: laid.lanes }).map((_, laneIdx) => (
            <div className="tl-row" key={laneIdx} style={{ height: rowHeight }}>
              {days.map((dt, i) => (
                <div
                  key={i}
                  className={`tl-row-cell ${isWeekend(dt) ? 'weekend' : ''}`}
                  style={{ width: dayWidth }}
                />
              ))}
            </div>
          ))}

          {overlapBands.map((b, i) => (
            <div
              key={`ob-${i}`}
              className="tl-overlap-band"
              style={{
                left: b.start * dayWidth,
                width: (b.end - b.start + 1) * dayWidth,
              }}
              title="Период с пересечениями задач"
            />
          ))}

          <div className="tl-today-line" style={{ left: todayLeft }}/>

          {laid.tasks.map(t => {
            const s = parseISO(t.start), e = parseISO(t.end);
            const left = daysBetween(rangeStart, s) * dayWidth + 3;
            const width = (daysBetween(s, e) + 1) * dayWidth - 6;
            const top = t.lane * rowHeight + 5;
            const isSel = t.id === selectedId;
            const dim = selectedId && !isSel;
            return (
              <div
                key={t.id}
                className={`tl-bar ${isSel ? 'selected' : ''} ${dim ? 'dim' : ''} ${width < 80 ? 'tight' : ''} ${width < 48 ? 'very-tight' : ''}`}
                data-status={t.status}
                style={{
                  left, width, top,
                  '--bar-prio': t.priority === 'high' ? 'var(--p-high)' : t.priority === 'med' ? 'var(--p-med)' : 'var(--p-low)',
                }}
                onClick={(ev) => { ev.stopPropagation(); onSelect(t.id); }}
                title={`${t.title} · ${fmtDateShort(s)} → ${fmtDateShort(e)} · ${STATUS[t.status].label}`}
              >
                <span className="bar-prio"/>
                <span className="bar-title">{t.title}</span>
                <span className="bar-meta">{t.effort}д</span>
                <button
                  className="bar-delete"
                  title="Удалить задачу"
                  onClick={(ev) => { ev.stopPropagation(); if (confirm(`Удалить задачу «${t.title}»?`)) onDelete(t.id); }}
                >
                  <Icon.x/>
                </button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

    return (
      <div className="empty">
        <div className="empty-icon"><Icon.cal/></div>
        <div className="empty-title">Задач не найдено</div>
        <div className="empty-sub">Добавьте первую задачу в форме слева — она появится на таймлайне и в этом списке.</div>
      </div>
    );
  }
  return (
    <>
      <div className="list-toolbar">
        <div className="list-toolbar-left">
          <span className="list-label">Задачи</span>
          <div className="list-filters">
            {[
              ['all', 'Все'],
              ['progress', 'В работе'],
              ['planned', 'Запланировано'],
              ['done', 'Готово'],
              ['paused', 'На паузе'],
            ].map(([k, label]) => (
              <button
                key={k}
                className={filter === k ? 'active' : ''}
                onClick={() => setFilter(k)}

                {label}<span className="count">{counts[k]}</span>

            ))}

        </div>

        </span>
      </div>

      <div className="list-scroll">
        <table className="list-table">
          <thead>
            <tr>
              <th style={{ width: '38%' }}>Задача</th>
              <th style={{ width: '16%' }}>Даты</th>
              <th style={{ width: '10%' }} className="num">Длит.</th>
              <th style={{ width: '10%' }} className="num">Оценка</th>
              <th style={{ width: '14%' }}>Статус</th>
              <th style={{ width: '12%' }}>Приоритет</th>
              <th style={{ width: '36px' }}></th>

          </thead>
          <tbody>
            {tasks.map(t => {
              const s = parseISO(t.start), e = parseISO(t.end);
              const dur = daysBetween(s, e) + 1;
              const isSel = t.id === selectedId;
              const dim = selectedId && !isSel;
              const hasOverlap = overlappingIds.has(t.id);
              return (
                <tr
                  key={t.id}
                  className={`${isSel ? 'selected' : ''} ${dim ? 'dim' : ''}`}
                  onClick={() => onSelect(t.id)}
                >
                  <td className="name">
                    {t.title}
                    {t.url && <span className="link-ico"><Icon.link/></span>}
                    {hasOverlap && t.status !== 'done' && (
                      <span
                        className="conflict-pill"
                        title="Открыть конфликт на таймлайне"
                        onClick={(ev) => { ev.stopPropagation(); onFocusConflict(t.id); }}
                      >
                        пересечение <Icon.chevR/>
                      </span>
                    )}
                  </td>
                  <td className="dates mono">{fmtDateShort(s)} → {fmtDateShort(e)}</td>
                  <td className="meta mono num">{dur}</td>
                  <td className="meta mono num">{t.effort}</td>
                  <td>
                    <span className={`badge status-${t.status}`}>
                      <span className="dot"/>

                  </td>
                  <td>
                    <span className={`prio ${t.priority}`}>
                      <span className="bars"><span/><span/><span/></span>

                    </span>
                  </td>
                  <td className="actions-cell">
                    <button
                      className="row-delete"
                      title="Удалить задачу"
                      onClick={(ev) => { ev.stopPropagation(); if (confirm(`Удалить задачу «${t.title}»?`)) onDelete(t.id); }}
                    >

}

// ========== APP ==========
function App() {
  const [tasks, setTasks] = useState([]);
  const [loading, setLoading] = useState(true);   // true пока грузим задачи из БД
  const [error, setError] = useState(null);        // сообщение если что-то пошло не так
  const [selectedId, setSelectedId] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [filter, setFilter] = useState('all');
  const [tweaks, setTweaks] = useState({ accent: 'amber', density: 'comfortable', zoom: 'day' });
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [scrollSignal, setScrollSignal] = useState(0);

  // При первом открытии — загружаем все задачи из Supabase.
  // db.from('tasks').select('*') — это SQL: SELECT * FROM tasks ORDER BY created_at
  useEffect(() => {
    db.from('tasks').select('*').order('created_at')
      .then(({ data, error }) => {
        if (error) { setError(error.message); }
        else { setTasks(data.map(fromDB)); }
        setLoading(false);
      });
  }, []);

  useEffect(() => {
    const accentMap = {
      amber: '#2563eb',
      blue:  '#0891b2',
      plum:  '#7c3aed',
      moss:  '#059669',
    };
    const c = accentMap[tweaks.accent] || accentMap.amber;
    document.documentElement.style.setProperty('--selection', c);
    document.documentElement.style.setProperty('--today', c);
    document.documentElement.style.setProperty('--row-h', tweaks.density === 'compact' ? '30px' : '36px');
  }, [tweaks]);

  const dayWidth = tweaks.zoom === 'wide' ? 52 : tweaks.zoom === 'week' ? 26 : 38;

  const range = useMemo(() => {
    const dates = tasks.flatMap(t => [parseISO(t.start), parseISO(t.end)]);
    dates.push(TODAY);
    const min = new Date(Math.min(...dates.map(d => d.getTime())));
    const max = new Date(Math.max(...dates.map(d => d.getTime())));
    return { start: addDays(startOfDay(min), -3), end: addDays(startOfDay(max), 5) };
  }, [tasks]);

  const visibleTasks = useMemo(() => {
    if (filter === 'all') return tasks;
    return tasks.filter(t => t.status === filter);
  }, [tasks, filter]);

  const counts = useMemo(() => {
    const c = { all: tasks.length, planned: 0, progress: 0, done: 0, paused: 0 };
    tasks.forEach(t => c[t.status]++);
    return c;
  }, [tasks]);

  const overlappingIds = useMemo(() => {
    const set = new Set();
    const active = tasks.filter(t => t.status !== 'done');
    for (let i = 0; i < active.length; i++) {
      for (let j = i + 1; j < active.length; j++) {
        const a = active[i], b = active[j];
        const as = parseISO(a.start), ae = parseISO(a.end);
        const bs = parseISO(b.start), be = parseISO(b.end);
        if (as <= be && bs <= ae) { set.add(a.id); set.add(b.id); }
      }
    }
    return set;
  }, [tasks]);

  const stats = useMemo(() => {
    const active = tasks.filter(t => t.status === 'progress').length;
    const planned = tasks.filter(t => t.status === 'planned').length;
    const done = tasks.filter(t => t.status === 'done').length;
    const conflicts = overlappingIds.size;
    return { active, planned, done, conflicts, total: tasks.length };
  }, [tasks, overlappingIds]);

  const editingTask = tasks.find(t => t.id === editingId) || null;

  // INSERT — добавляем строку в таблицу tasks, потом обновляем локальный стейт
  const handleAdd = async (t) => {
    const { error } = await db.from('tasks').insert(toDB(t));
    if (error) { alert('Ошибка при добавлении: ' + error.message); return; }
    setTasks(p => [...p, t]);
  };

  // UPDATE — обновляем строку где id совпадает
  const handleSave = async (t) => {
    const { error } = await db.from('tasks').update(toDB(t)).eq('id', t.id);
    if (error) { alert('Ошибка при сохранении: ' + error.message); return; }
    setTasks(p => p.map(x => x.id === t.id ? t : x));
  };

  // DELETE — удаляем строку где id совпадает
  const handleDelete = async (id) => {
    const { error } = await db.from('tasks').delete().eq('id', id);
    if (error) { alert('Ошибка при удалении: ' + error.message); return; }
    setTasks(p => p.filter(x => x.id !== id));
    if (editingId === id) setEditingId(null);
    if (selectedId === id) setSelectedId(null);
  };
  const handleClear = () => setEditingId(null);
  const handleSelectFromList = (id) => { setSelectedId(id); setEditingId(id); };
  const handleSelectFromTimeline = (id) => {
    if (selectedId === id) { setSelectedId(null); setEditingId(null); }
    else { setSelectedId(id); setEditingId(id); }
  };

  const scrollToToday = () => {
    const s = document.querySelector('.tl-scroll');
    if (s) {
      const offset = daysBetween(range.start, TODAY) * dayWidth;
      s.scrollTo({ left: Math.max(0, offset - 200), behavior: 'smooth' });
    }
  };
  const focusConflict = (id) => {
    setSelectedId(id); setEditingId(id);
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    const s = document.querySelector('.tl-scroll');
    if (s) {
      const offset = daysBetween(range.start, parseISO(t.start)) * dayWidth;
      s.scrollTo({ left: Math.max(0, offset - 120), behavior: 'smooth' });
    }
  };

  const todayLabel = `${TODAY.getDate()} ${MONTHS_FULL[TODAY.getMonth()].toLowerCase()} ${TODAY.getFullYear()}`;
  const rangeLabel = (() => {
    const s = range.start, e = range.end;
    if (s.getMonth() === e.getMonth() && s.getFullYear() === e.getFullYear()) {
      return `${s.getDate()}–${e.getDate()} ${MONTHS_FULL[s.getMonth()].toLowerCase()} ${s.getFullYear()}`;
    }
    return `${s.getDate()} ${MONTHS_RU[s.getMonth()].toLowerCase()} — ${e.getDate()} ${MONTHS_RU[e.getMonth()].toLowerCase()} ${e.getFullYear()}`;
  })();

  // Пока задачи грузятся из Supabase — показываем заглушку
  if (loading) return (
    <div style={{ height:'100vh', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:12, color:'var(--ink-3)', fontFamily:'Inter,sans-serif' }}>
      <div style={{ width:24, height:24, border:'2px solid var(--line-2)', borderTopColor:'var(--selection)', borderRadius:'50%', animation:'spin 0.7s linear infinite' }}/>
      <style>{`@keyframes spin { to { transform: rotate(360deg) } }`}</style>
      <span style={{ fontSize:13 }}>Загружаем задачи…</span>
    </div>
  );

  if (error) return (
    <div style={{ height:'100vh', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:8, color:'var(--conflict)', fontFamily:'Inter,sans-serif' }}>
      <span style={{ fontSize:14, fontWeight:600 }}>Не удалось подключиться к базе</span>
      <span style={{ fontSize:12, color:'var(--ink-3)' }}>{error}</span>
    </div>
  );

  return (
    <div className="app">
      <header className="topbar">
        <div className="brand">
          <span className="brand-mark"/>
          <span>Планировщик</span>
          <span className="sep">/</span>
          <span className="sub">личные задачи</span>
        </div>
        <div className="topbar-metrics">
          <span className="metric">всего <span className="v">{stats.total}</span></span>
          <span className="metric">в работе <span className="v">{stats.active}</span></span>
          <span className="metric">запланировано <span className="v">{stats.planned}</span></span>
          <span className="metric">готово <span className="v">{stats.done}</span></span>
          {stats.conflicts > 0 && (
            <span className="metric warn">пересечений <span className="v">{stats.conflicts}</span></span>
          )}
        </div>
        <div className="topbar-right">
          <button className="ghost-btn" onClick={() => setTweaksOpen(v => !v)} title="Настройки"><Icon.gear/></button>
        </div>
      </header>

      <aside className="form-pane">
        <div className="pane-header">
          <span className="pane-title">{editingTask ? 'Редактировать' : 'Добавить задачу'}</span>
          <span className="pane-sub">{editingTask ? 'изменения применяются сразу' : 'быстрый ввод'}</span>
        </div>
        <TaskForm
          editingTask={editingTask}
          onAdd={handleAdd}
          onSave={handleSave}
          onDelete={handleDelete}
          onClear={handleClear}
        />
      </aside>

      <main className="main-pane">
        <div className="timeline-wrap">
          <div className="timeline-toolbar">
            <div className="tl-title-group">
              <span className="tl-range">{rangeLabel}</span>
              <span className="tl-today-inline">сегодня, {todayLabel}</span>
            </div>
            <div className="tl-controls">
              <div className="zoom-group">
                <button className={tweaks.zoom==='week'?'active':''} onClick={()=>setTweaks({...tweaks, zoom:'week'})}>Неделя</button>
                <button className={tweaks.zoom==='day'?'active':''} onClick={()=>setTweaks({...tweaks, zoom:'day'})}>День</button>
                <button className={tweaks.zoom==='wide'?'active':''} onClick={()=>setTweaks({...tweaks, zoom:'wide'})}>Шире</button>
              </div>
              <button className="today-btn" onClick={scrollToToday}>
                <Icon.target/> К сегодня
              </button>
            </div>
          </div>
          <Timeline
            tasks={visibleTasks}
            selectedId={selectedId}
            onSelect={handleSelectFromTimeline}
            onDelete={handleDelete}
            dayWidth={dayWidth}
            rangeStart={range.start}
            rangeEnd={range.end}
            scrollSignal={scrollSignal}
          />
        </div>

        <div className="list-wrap">
          <TaskList
            tasks={visibleTasks}
            selectedId={selectedId}
            onSelect={handleSelectFromList}
            onDelete={handleDelete}
            onFocusConflict={focusConflict}
            overlappingIds={overlappingIds}
            filter={filter}
            setFilter={setFilter}
            counts={counts}
          />
        </div>
      </main>

      <TweaksPanel open={tweaksOpen} tweaks={tweaks} setTweaks={setTweaks}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
